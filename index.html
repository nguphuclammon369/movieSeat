<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Seat Selection - Redux</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="page">
    <div class="container">
      <h1 class="title">Movie Seat Selection</h1>
      <h2 class="subtitle">fill the required details below and select your seats</h2>

      <!-- FORM -->
      <section class="booking-form">
        <div class="row justify-content-center g-4">
          <div class="col-md-4">
            <label for="nameInput">Name <span>*</span></label>
            <input id="nameInput" type="text" placeholder="Enter your name">
          </div>

          <div class="col-md-4">
            <label for="seatNumberInput">Number of Seats <span>*</span></label>
            <input id="seatNumberInput" type="number" min="1" max="20" value="2">
          </div>

          <div class="col-md-4 button-col">
            <button id="startBtn" class="main-btn">Start Selecting</button>
          </div>
        </div>
      </section>

      <div id="message"></div>

      <!-- LEGEND -->
      <div class="legend">
        <div><span class="seat-example selected"></span> Selected Seat</div>
        <div><span class="seat-example reserved"></span> Reserved Seat</div>
        <div><span class="seat-example empty"></span> Empty Seat</div>
      </div>

      <!-- SEAT MAP -->
      <section class="seat-area">
        <div id="seatMap"></div>
      </section>

      <div class="screen">Screen this way</div>

      <div class="text-center">
        <button id="confirmBtn" class="confirm-btn">Confirm Selection</button>
      </div>

      <!-- RESULT TABLE -->
      <section class="result-box">
        <table class="result-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Number of Seats</th>
              <th>Seats</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="resultBody">
            <tr>
              <td id="resultName">---</td>
              <td id="resultQuantity">---</td>
              <td id="resultSeats">---</td>
              <td id="resultTotal">0 VNĐ</td>
            </tr>
          </tbody>
        </table>
      </section>

      <footer>
        © 2026 Movie Seat Selection . All Rights Reserved | Design by W3layouts
      </footer>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/redux@4.2.1/dist/redux.min.js"></script>

  <script src="js/actions.js"></script>
  <script src="js/reducer.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
